<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS API Dashboard</title>
    <style>
        :root { --primary: #3498db; --success: #2ecc71; --danger: #e74c3c; --warning: #f39c12; --dark: #2c3e50; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--light); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 25px; margin-bottom: 25px; border: 1px solid #eee; }
        
        .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .status-card { text-align: center; padding: 20px; transition: transform 0.2s; }
        .status-card:hover { transform: translateY(-5px); }
        .status-card h3 { margin: 0 0 10px; color: #7f8c8d; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .status-card .value { font-size: 28px; font-weight: 700; color: var(--dark); }
        .status-online { color: var(--success) !important; }
        .status-offline { color: var(--danger) !important; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 15px; background: #f8fafc; color: #64748b; font-weight: 600; border-bottom: 2px solid #edf2f7; }
        td { padding: 15px; border-bottom: 1px solid #edf2f7; vertical-align: middle; }
        tr:hover { background-color: #fcfcfd; }

        .btn { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-danger { background: #fee2e2; color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn-warning { background: #fef3c7; color: var(--warning); }
        .btn-warning:hover { background: var(--warning); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 500px; max-width: 90%; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        textarea.form-control { height: 120px; resize: none; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }

        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; background: #e2e8f0; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .user-info-bar { display: flex; align-items: center; gap: 10px; background: #fff; padding: 8px 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .logout-link { font-size: 12px; color: var(--danger); text-decoration: none; border: 1px solid var(--danger); padding: 2px 6px; border-radius: 4px; }
        .logout-link:hover { background: var(--danger); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>CMS API Dashboard</h1>
                <div class="user-info-bar">
                    <span style="font-size: 14px; font-weight: 600;">접속: <span id="current-user">확인 중...</span></span>
                    <a href="/logout" class="logout-link">로그아웃</a>
                </div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <span id="last-update" style="font-size: 12px; color: #94a3b8;">마지막 갱신: -</span>
                <button class="btn btn-primary" onclick="openModal()">+ 새 콘텐츠 추가</button>
            </div>
        </div>

        <div class="status-grid">
            <div class="card status-card">
                <h3>서버 상태</h3>
                <div id="server-status" class="value">확인 중...</div>
            </div>
            <div class="card status-card">
                <h3>메모리 사용률</h3>
                <div id="memory-usage" class="value">0%</div>
            </div>
            <div class="card status-card">
                <h3>총 콘텐츠 수</h3>
                <div id="contents-count" class="value">0</div>
            </div>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin:0">콘텐츠 관리</h2>
                <div id="table-loader" class="loader"></div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>제목</th>
                        <th>설명</th>
                        <th>작성자</th>
                        <th>등록일</th>
                        <th style="width: 150px;">작업</th>
                    </tr>
                </thead>
                <tbody id="contents-body">
                    <tr><td colspan="6" style="text-align: center;">데이터를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="contentModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">새 콘텐츠 추가</h2>
            <form id="contentForm">
                <input type="hidden" id="contentId">
                <div class="form-group">
                    <label>제목</label>
                    <input type="text" id="title" class="form-control" required placeholder="제목을 입력하세요">
                </div>
                <div class="form-group">
                    <label>설명</label>
                    <textarea id="description" class="form-control" required placeholder="내용을 입력하세요"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModal()">취소</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api/contents';
        let isModalOpen = false;

        async function fetchDashboard() {
            if (isModalOpen) return;

            document.getElementById('table-loader').style.display = 'block';
            try {
                await Promise.all([fetchStatus(), fetchMetrics(), fetchContents(), fetchCurrentUser()]);
                document.getElementById('last-update').textContent = `마지막 갱신: ${new Date().toLocaleTimeString()}`;
            } catch (e) {
                console.error('Update failed', e);
            } finally {
                document.getElementById('table-loader').style.display = 'none';
            }
        }

        async function fetchCurrentUser() {
            try {
                const res = await fetch(`${API_BASE}/me`);
                if (res.status === 401) {
                    document.getElementById('current-user').textContent = '로그인 필요';
                    return;
                }
                const data = await res.json();
                document.getElementById('current-user').textContent = data.username;
            } catch {
                document.getElementById('current-user').textContent = '연결 오류';
            }
        }

        async function fetchStatus() {
            try {
                const res = await fetch('/actuator/health');
                const data = await res.json();
                const el = document.getElementById('server-status');
                el.textContent = data.status;
                el.className = 'value ' + (data.status === 'UP' ? 'status-online' : 'status-offline');
            } catch {
                const el = document.getElementById('server-status');
                el.textContent = 'OFFLINE';
                el.className = 'value status-offline';
            }
        }

        async function fetchMetrics() {
            try {
                const [usedRes, maxRes] = await Promise.all([
                    fetch('/actuator/metrics/jvm.memory.used'),
                    fetch('/actuator/metrics/jvm.memory.max')
                ]);
                const used = (await usedRes.json()).measurements[0].value;
                const max = (await maxRes.json()).measurements[0].value;
                document.getElementById('memory-usage').textContent = (used / max * 100).toFixed(1) + '%';
            } catch {
                document.getElementById('memory-usage').textContent = 'N/A';
            }
        }

        async function fetchContents() {
            try {
                const res = await fetch(API_BASE);
                const data = await res.json();
                const list = data.content || data;
                
                document.getElementById('contents-count').textContent = data.totalElements || list.length;
                const body = document.getElementById('contents-body');
                body.innerHTML = list.length ? '' : '<tr><td colspan="6" style="text-align: center;">데이터가 없습니다.</td></tr>';

                list.forEach(item => {
                    const row = `<tr>
                        <td><span class="badge">${item.id}</span></td>
                        <td><strong>${item.title}</strong></td>
                        <td style="color: #666; font-size: 13px;">${item.description || '-'}</td>
                        <td><span class="badge" style="background:#f0f9ff; color:#0369a1">${item.createdBy || '시스템'}</span></td>
                        <td>${new Date(item.createdDate).toLocaleString()}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="editContent(${item.id})">수정</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteContent(${item.id})">삭제</button>
                        </td>
                    </tr>`;
                    body.insertAdjacentHTML('beforeend', row);
                });
            } catch (err) {
                document.getElementById('contents-body').innerHTML = '<tr><td colspan="6" style="text-align: center;">인증이 필요하거나 데이터 로드 중 오류가 발생했습니다.</td></tr>';
            }
        }

        async function saveContent(e) {
            e.preventDefault();
            const id = document.getElementById('contentId').value;
            const payload = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value
            };

            const url = id ? `${API_BASE}/${id}` : API_BASE;
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeModal();
                    fetchDashboard();
                } else if (res.status === 401 || res.status === 403) {
                    alert('로그인이 필요하거나 권한이 없습니다.');
                    window.location.reload();
                } else {
                    alert('저장 중 오류가 발생했습니다.');
                }
            } catch (err) {
                alert('서버와 통신할 수 없습니다.');
            }
        }

        async function editContent(id) {
            try {
                const res = await fetch(`${API_BASE}/${id}`);
                if (res.status === 401 || res.status === 403) {
                    alert('권한이 없습니다.');
                    return;
                }
                const data = await res.json();
                
                document.getElementById('contentId').value = data.id;
                document.getElementById('title').value = data.title;
                document.getElementById('description').value = data.description;
                
                document.getElementById('modalTitle').textContent = '콘텐츠 수정';
                openModal();
            } catch (err) {
                alert('데이터를 가져오는데 실패했습니다.');
            }
        }

        async function deleteContent(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;

            try {
                const res = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
                if (res.ok) fetchDashboard();
                else if (res.status === 403) alert('본인이 작성한 글만 삭제할 수 있습니다.');
                else alert('삭제 실패');
            } catch (err) {
                alert('서버 통신 오류');
            }
        }

        function openModal() {
            isModalOpen = true;
            document.getElementById('contentModal').style.display = 'flex';
        }

        function closeModal() {
            isModalOpen = false;
            document.getElementById('contentModal').style.display = 'none';
            document.getElementById('contentForm').reset();
            document.getElementById('contentId').value = '';
            document.getElementById('modalTitle').textContent = '새 콘텐츠 추가';
        }

        document.getElementById('contentForm').onsubmit = saveContent;
        fetchDashboard();
        setInterval(fetchDashboard, 10000);
    </script>
</body>
</html>
